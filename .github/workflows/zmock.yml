name: Mock

# Only run on branches (e.g. not tags)
on:
  workflow_dispatch:

jobs:
  install_python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: s390x
            runner: ubuntu-24.04-s390x
          - arch: ppc64le
            runner: ubuntu-24.04-ppc64le
          - arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify Groups
        run: | 
          id
          groups

          git clone https://github.com/ManageIQ/manageiq-rpm_build
          cp assets/manageiq/build_deps manageiq-rpm_build/bin/build_dependencies
          cd manageiq-rpm_build
          bash bin/build_dependencies
